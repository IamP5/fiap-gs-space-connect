name: Issue Sync

# Safety net for keeping the issue tracker in sync with merged work.
# GitHub already auto-closes issues referenced with `Closes #NN` in a PR body.
# This catches the gap that bit us before: PRs whose ONLY reference was in the
# title (e.g. `feat(#52): …` or `… (#54)`) merged without closing the issue,
# leaving 13 issues "merged-but-open". On every merged PR we parse the title +
# body and close the issues the PR delivered — while never closing issues that
# are only *referenced* (Relates / Blocked by / Refs / Parent / Epic).
#
# See docs/harness/issue-tracking.md for the convention this enforces.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-referenced-issues:
    name: Close issues delivered by merged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            const prNum = pr.number;

            const close = new Set();
            const skip = new Set();

            // 1) Numbers in the PR TITLE are the primary delivered issue(s):
            //    our convention is `feat(#NN): …` or `… (#NN)`.
            for (const m of title.matchAll(/#(\d+)/g)) close.add(Number(m[1]));

            // 2) Explicit closing keywords anywhere in the body.
            const closeKw = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b[:\s]+#(\d+)/gi;
            for (const m of body.matchAll(closeKw)) close.add(Number(m[1]));

            // 3) Reference-only keywords must NOT close (these are dependencies/links).
            const refKw = /\b(?:relates?(?:\s+to)?|blocked\s+by|refs?|see|part\s+of|parent|epic)\b[:\s]+#(\d+)/gi;
            for (const m of body.matchAll(refKw)) skip.add(Number(m[1]));

            const targets = [...close].filter((n) => !skip.has(n) && n !== prNum);
            if (targets.length === 0) {
              core.info("No closable issue references found in title/body.");
              return;
            }
            core.info(`Candidate issues to close: ${targets.join(", ")}`);

            for (const issue_number of targets) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });
                if (issue.pull_request) continue; // a PR, not an issue
                if (issue.state === "closed") continue; // already closed
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `Auto-closed: delivered in #${prNum} (merged to \`${pr.base.ref}\`).`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                });
                core.info(`Closed #${issue_number}`);
              } catch (e) {
                // Read-only token (e.g. fork PR) or transient error — don't fail the run.
                core.warning(`Could not close #${issue_number}: ${e.message}`);
              }
            }
