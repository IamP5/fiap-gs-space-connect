name: Issue Sync

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-referenced-issues:
    name: Close issues delivered by merged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            const prNum = pr.number;

            const close = new Set();
            const skip = new Set();

            for (const m of title.matchAll(/#(\d+)/g)) close.add(Number(m[1]));

            const closeKw = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b[:\s]+#(\d+)/gi;
            for (const m of body.matchAll(closeKw)) close.add(Number(m[1]));

            const refKw = /\b(?:relates?(?:\s+to)?|blocked\s+by|refs?|see|part\s+of|parent|epic)\b[:\s]+#(\d+)/gi;
            for (const m of body.matchAll(refKw)) skip.add(Number(m[1]));

            const targets = [...close].filter((n) => !skip.has(n) && n !== prNum);
            if (targets.length === 0) {
              core.info("No closable issue references found in title/body.");
              return;
            }
            core.info(`Candidate issues to close: ${targets.join(", ")}`);

            for (const issue_number of targets) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });
                if (issue.pull_request) continue;
                if (issue.state === "closed") continue;
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `Auto-closed: delivered in #${prNum} (merged to \`${pr.base.ref}\`).`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                });
                core.info(`Closed #${issue_number}`);
              } catch (e) {
                core.warning(`Could not close #${issue_number}: ${e.message}`);
              }
            }
