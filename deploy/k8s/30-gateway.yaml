# WS Gateway — tails NATS world snapshots and fans them out to browser WebSocket
# clients, relaying browser control frames (e.g. KILL Rx) back onto NATS. The
# browser never speaks NATS — only this gateway does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: gateway
  template:
    metadata:
      labels:
        app: swarmbuild
        role: gateway
    spec:
      containers:
        - name: gateway
          image: swarmbuild-gateway:dev
          imagePullPolicy: IfNotPresent # use the kind-loaded local image
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: GATEWAY_ADDR
              value: ":8080"
          # Live lab mode (bh-07): the gateway mounts the /lab/* endpoints only
          # when it sees an API key at startup. The key comes from the OPTIONAL
          # 'swarmbuild-llm' Secret (synced by up.sh from the repo-root .env, never
          # committed). Secret absent ⇒ gateway still starts, live lab is simply
          # off and the headline replays baked specs. Override LAB_PROVIDER /
          # LAB_MODEL here to swap vendor (defaults: openai / gpt-4o-2024-08-06).
          envFrom:
            - secretRef:
                name: swarmbuild-llm
                optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: gateway
spec:
  selector:
    app: swarmbuild
    role: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
