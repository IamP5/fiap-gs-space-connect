apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: gateway
  template:
    metadata:
      labels:
        app: swarmbuild
        role: gateway
    spec:
      containers:
        - name: gateway
          image: swarmbuild-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: GATEWAY_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: gateway
spec:
  selector:
    app: swarmbuild
    role: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
