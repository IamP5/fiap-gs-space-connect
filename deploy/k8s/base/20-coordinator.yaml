apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: coordinator
  template:
    metadata:
      labels:
        app: swarmbuild
        role: coordinator
    spec:
      containers:
        - name: coordinator
          image: swarmbuild-coordinator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats:4222
