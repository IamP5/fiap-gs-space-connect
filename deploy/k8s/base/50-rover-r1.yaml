apiVersion: apps/v1
kind: Deployment
metadata:
  name: rover-r1
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: rover
    rover: R1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: rover
      rover: R1
  template:
    metadata:
      labels:
        app: swarmbuild
        role: rover
        rover: R1
    spec:
      containers:
        - name: rover
          image: swarmbuild-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --id=R1
            - --x=-50
            - --y=-70
            - --battery=1.00
            - --capabilities=foundation,wall,dome-cap,panel,mast
            - --mode=container
            - --heartbeat-ms=700
            - --op-every-ms=360
          env:
            - name: NATS_URL
              value: nats://nats:4222
          envFrom:
            - secretRef:
                name: swarmbuild-llm
                optional: true
