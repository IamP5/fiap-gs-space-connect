apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: web
  template:
    metadata:
      labels:
        app: swarmbuild
        role: web
    spec:
      containers:
        - name: web
          image: swarmbuild-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: web
spec:
  selector:
    app: swarmbuild
    role: web
  ports:
    - name: http
      port: 80
      targetPort: 80
