# Rover R4 — its OWN Pod. This is the whole point of the pod-per-rover variant:
# each Rover is a standalone process (--mode=container) joining the swarm over
# NATS, so the killer can `kubectl delete pod -l rover=R4` to take exactly this
# Rover offline. Its Lease then TTL-expires and the swarm Self-heals by
# Re-auction onto a surviving Rover Pod. Flags mirror internal/demo DomeRovers()
# for R4 exactly (id/x/y/battery/capabilities), so the board is identical to
# the in-proc headline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rover-r4
  namespace: swarmbuild
  labels:
    app: swarmbuild
    role: rover
    rover: R4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmbuild
      role: rover
      rover: R4
  template:
    metadata:
      labels:
        app: swarmbuild
        role: rover
        rover: R4 # the label the killer's selector (rover=R4) deletes
    spec:
      containers:
        - name: rover
          image: swarmbuild-agent:dev
          imagePullPolicy: IfNotPresent # use the kind-loaded local image
          args:
            - --id=R4
            - --x=10
            - --y=-70
            - --battery=0.85
            - --capabilities=foundation,wall,dome-cap,panel,mast
            - --mode=container
            - --heartbeat-ms=700
            - --op-every-ms=360 # slow the block-by-block habitat rise (~3x the brisk default) so the buildout reads on-camera
          env:
            - name: NATS_URL
              value: nats://nats:4222
          # Live Build Mode (bh-08): the OPTIONAL swarmbuild-llm Secret (synced by
          # up.sh from the repo-root .env) gives this rover Pod the API key, making it
          # LIVE-CAPABLE. cmd/agent injects the LiveBuilder when a key is present but
          # keeps the rover's default Mode = replay, so only a per-Task live tag (a
          # Blueprint dropped in "live" mode) builds inline; the headline stays
          # deterministic. Secret absent => pure replay, Pod still starts.
          envFrom:
            - secretRef:
                name: swarmbuild-llm
                optional: true
