# SwarmBuild walking-skeleton stack (issue 01): NATS + coordinator + gateway + web.
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:5173 — the "all systems connected" indicator goes
# green once the gateway's bus is up, and the swarm builds the dome (kill → heal).
name: swarmbuild

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"] # JetStream on; monitoring (/healthz) on 8222
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s

  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/coordinator
    environment:
      NATS_URL: nats://nats:4222
      # Live Build Mode (bh-08): pass an API key through from the host shell to give
      # the in-process rovers the Model seam. Unset ⇒ empty ⇒ the demo stays pure
      # replay (no live builds). Server-side only; never reaches the browser.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LAB_PROVIDER: ${LAB_PROVIDER:-}
      LAB_MODEL: ${LAB_MODEL:-}
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/gateway
    environment:
      NATS_URL: nats://nats:4222
      GATEWAY_ADDR: ":8080"
      # Optional: the lab "LIVE GENERATION" console (bh-07) uses the same key. Unset
      # ⇒ the lab endpoint returns 503 and the rest of the dashboard is unaffected.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LAB_PROVIDER: ${LAB_PROVIDER:-}
      LAB_MODEL: ${LAB_MODEL:-}
    ports:
      - "8080:8080" # WebSocket (/ws) + /healthz
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ../web
      args:
        # Browser runs on the host, so it reaches the gateway via the published port.
        VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "5173:80"
    depends_on:
      - gateway

  # --- Container Encore (ADR-0001, issue 11) -------------------------------
  # rover-encore + killer are the OPTIONAL encore: a genuinely separate rover
  # (R7) joins the swarm over NATS as its own container, and the killer sidecar
  # does a real `docker kill` on it from a dashboard control. The killed
  # container goes silent, its Lease TTL-expires, and the swarm Self-heals by
  # Re-auction over the SAME real bus as the in-proc headline. They are NOT
  # required for `make smoke` / the core demo — that runs on the in-proc rovers.

  # R7 runs the SAME agent binary as the in-proc rovers, but as a standalone
  # container (--mode=container) joining over NATS. Its capabilities cover every
  # dome task type (foundation|wall|dome-cap, matching internal/demo's roster) so
  # it can win and finish a re-auctioned task. container_name is fixed so the
  # killer can target it deterministically.
  rover-encore:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/agent
    container_name: swarmbuild-rover-encore
    command: ["--mode=container", "--id=R7", "--capabilities=foundation,wall,dome-cap"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure

  # The killer sidecar: the ONLY service that gets the docker CLI (via
  # Dockerfile.killer's docker:cli runtime) and the host docker socket. It maps
  # R7 → swarmbuild-rover-encore (KILLER_TARGETS) and, on a killContainer control
  # from the dashboard, does `docker kill swarmbuild-rover-encore`. The browser
  # and every other service NEVER get the socket.
  killer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.killer
    environment:
      NATS_URL: nats://nats:4222
      KILLER_TARGETS: R7=swarmbuild-rover-encore
    volumes:
      # ONLY the killer sidecar mounts docker.sock (read-only is enough for
      # `docker kill`). This is the single privileged seam of the whole stack.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure
